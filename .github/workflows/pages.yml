name: Deploy appcast

# Publishes appcast.xml to GitHub Pages at https://simplemapper.coprimal.dev/appcast.xml,
# the app's SUFeedURL since 1.1.5. Nothing else in the repo is published.
# Builds <= 1.1.4 read https://dinhanhthi.github.io/SimpleMapper/appcast.xml, a mirror that
# scripts/sync-feed-mirror.sh updates (see CONTRIBUTING.md "Update feed").
# Requires Settings > Pages > Source = "GitHub Actions".
# scripts/publish-appcast.sh pushes the new appcast.xml to main, which triggers this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'appcast.xml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Stage site
        run: |
          mkdir -p _site
          cp appcast.xml _site/appcast.xml
          [ -f _site/appcast.xml ] || { echo "::error::_site/appcast.xml is missing"; exit 1; }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
